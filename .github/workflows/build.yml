name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'jarvis-android.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Jarvis ZIP
        run: |
          unzip -q jarvis-android.zip -d source
          test -f source/jarvis-android/app/build.gradle.kts

      - name: Build debug APK
        working-directory: source/jarvis-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: source/jarvis-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
